plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id "org.jetbrains.kotlin.plugin.compose"
    id("com.google.devtools.ksp") // 引入 Ksp 插件
    id("com.google.dagger.hilt.android")
}

android {
    namespace "com.pw.codeset"
    compileSdk cfgs.compileSdk

    defaultConfig {
        applicationId "com.pw.codeset"
        minSdkVersion cfgs.minSdk
        targetSdk cfgs.targetSdk
        versionCode cfgs.versionCode
        versionName cfgs.versionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        signingConfigs {
            release {
                storeFile file("../release")
                storePassword "77Xingfu"
                keyAlias "pwcode"
                keyPassword "77Xingfu"
            }
            debug {
                storeFile file("../release")
                storePassword "77Xingfu"
                keyAlias "pwcode"
                keyPassword "77Xingfu"
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
    compileOptions {
        sourceCompatibility cfgs.javaVersion
        targetCompatibility cfgs.javaVersion
    }
    kotlinOptions {
        jvmTarget = cfgs.jvm
    }
    buildFeatures{
        compose true
    }

    android.applicationVariants.all { variant ->
        variant.outputs.all {
            //定义apk名字
            def fileName = "MyT.apk"
//            fileName = fileName.replace("application-", "${defaultConfig.applicationId.substring(defaultConfig.applicationId.lastIndexOf(".") + 1)}-")
            fileName = fileName.replace(".apk", "-${defaultConfig.versionName}.apk")
            outputFileName = fileName
        }
    }

    viewBinding{enable=true}
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.core:core-ktx:$cfgs.ktx"
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.activity:activity-ktx:1.10.1"
    implementation "com.google.android.material:material:1.12.0"
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation "androidx.recyclerview:recyclerview:1.2.1"

    implementation platform("androidx.compose:compose-bom:2024.02.00")
    implementation "androidx.activity:activity-compose"


    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.runtime:runtime-livedata"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.6.2" // 请检查最新版本

// Hilt 核心依赖
    implementation("com.google.dagger:hilt-android:2.54")
    ksp("com.google.dagger:hilt-android-compiler:2.54")

    // Hilt 与 Compose 导航的集成 (非常重要)
    implementation("androidx.hilt:hilt-navigation-compose:1.1.0")

    // 基础库
    implementation("androidx.glance:glance-appwidget:1.1.0")

    debugImplementation "androidx.compose.ui:ui-tooling"

    implementation "io.reactivex.rxjava2:rxandroid:2.1.1"
    implementation "io.reactivex.rxjava2:rxjava:2.2.21"

    implementation "com.github.bumptech.glide:glide:4.14.2"
    implementation(project(":baseUtils"))

    implementation(project(":read"))

    implementation 'com.koushikdutta.async:androidasync:2.2.1'

    implementation 'com.google.code.gson:gson:2.11.0'


    implementation (name: 'picture_library-release', ext: 'aar')

    implementation project(':annotation')
    annotationProcessor project(':compiler')

}